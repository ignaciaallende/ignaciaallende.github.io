<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Redirecting</title>
        <!-- This survey has moved to /en/. This page only forwards old links, keeping the ?pid= parameter. -->
        <script>
            window.location.replace('../en/' + window.location.search + window.location.hash);
        </script>
        <meta http-equiv="refresh" content="1; url=../en/">
    </head>
    <body>
        <p>The survey has moved. <a href="../en/">Continue to the survey</a>.</p>
    </body>
</html>
